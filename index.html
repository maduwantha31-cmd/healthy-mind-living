<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Healthy Mind Living — Calm Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b3461; --ink-2:#2c4a7c; --blue:#3a6db3; --blue-soft:#dbe8f7; --sky:#eaf2fb;
  --paper:#f6f9fd; --card:#ffffff; --line:#d3e0ef; --muted:#5b6b84;
  --sage:#4f8a57; --sage-bg:#e8f3e9; --lav:#7659a6; --lav-bg:#f0ebf8;
  --amber:#b97c1d; --amber-bg:#fcf1de; --rose:#bd506b; --rose-bg:#fbe8ec;
  --shadow:0 1px 2px rgba(27,52,97,.06),0 6px 18px rgba(27,52,97,.06);
  --serif:"Libre Baskerville",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#dce7f7; --ink-2:#b9cbe6; --blue:#7fa9e6; --blue-soft:#1f3355; --sky:#15233a;
  --paper:#0e1829; --card:#15223a; --line:#26395a; --muted:#9aabc6;
  --sage:#8cc494; --sage-bg:#16301f; --lav:#b9a2e3; --lav-bg:#241d38; --amber:#e3b25e; --amber-bg:#342812;
  --rose:#ec8ea5; --rose-bg:#3a1a25; --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ink:#dce7f7; --ink-2:#b9cbe6; --blue:#7fa9e6; --blue-soft:#1f3355; --sky:#15233a;
  --paper:#0e1829; --card:#15223a; --line:#26395a; --muted:#9aabc6;
  --sage:#8cc494; --sage-bg:#16301f; --lav:#b9a2e3; --lav-bg:#241d38; --amber:#e3b25e; --amber-bg:#342812;
  --rose:#ec8ea5; --rose-bg:#3a1a25; --shadow:0 1px 2px rgba(0,0,0,.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:700;color:var(--ink);margin:0;line-height:1.2}
h1{font-size:clamp(1.7rem,4vw,2.4rem)}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0 0 .6em}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.hand{font-family:var(--hand);font-size:1.5rem;color:var(--blue);line-height:1.1}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:8px;text-align:left;text-decoration:none;color:var(--ink);border:0;background:none;padding:0;cursor:pointer}
.brand img{height:54px;width:auto}
.brand-name{font-family:var(--sans);font-weight:700;font-size:1.25rem;line-height:1;letter-spacing:-.01em}
.brand-name span{display:block}
.brand-sub{font-size:.72rem;color:var(--muted);font-weight:500;margin-top:3px}
.spacer{flex:1}
.help-short{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.help-btn{white-space:nowrap;background:var(--rose-bg);color:var(--rose);border:1px solid color-mix(in srgb,var(--rose) 35%,transparent);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;cursor:pointer}

/* Layout */
.shell{max-width:1180px;margin:0 auto;padding:22px 18px 110px}
.grid{display:grid;gap:16px}
@media (min-width:860px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g-side{grid-template-columns:1.35fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.tint-sage{background:var(--sage-bg);border-color:color-mix(in srgb,var(--sage) 22%,transparent)}
.tint-lav{background:var(--lav-bg);border-color:color-mix(in srgb,var(--lav) 22%,transparent)}
.tint-amber{background:var(--amber-bg);border-color:color-mix(in srgb,var(--amber) 22%,transparent)}
.tint-rose{background:var(--rose-bg);border-color:color-mix(in srgb,var(--rose) 22%,transparent)}
.tint-sky{background:var(--sky);border-color:var(--line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:700;border:1px solid transparent;cursor:pointer;background:var(--ink);color:var(--paper);font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--blue-soft);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Numbered section header like the worksheet */
.sec{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--serif);font-size:1.05rem;background:var(--blue)}
.num.sage{background:var(--sage)}.num.lav{background:var(--lav)}.num.amber{background:var(--amber)}.num.rose{background:var(--rose)}
:root[data-theme="dark"] .num, .dark-num{color:#0e1829}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .num{color:#0e1829}}
.sec h3{margin-top:5px}
.sec p{margin:2px 0 0;color:var(--muted);font-size:.95rem}

/* Scales */
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;max-width:620px}
.scale+.scale-labels{max-width:620px}
.scale button{height:46px;min-width:0;padding:0;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;font-size:1rem;transition:transform .12s}
.scale button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.08)}
.scale-labels{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.94rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
textarea,input[type=text],input[type=search]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;resize:vertical}
textarea{min-height:92px;background-image:repeating-linear-gradient(transparent,transparent 31px,color-mix(in srgb,var(--blue) 18%,transparent) 32px);line-height:32px;padding-top:4px}
label.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
label.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--ink);flex:none}

/* Bottom nav for client */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.76rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.badge{position:absolute;top:5px;right:calc(50% - 20px);background:var(--rose);color:#fff;border-radius:999px;font-size:.68rem;padding:0 6px;line-height:17px}

/* Hero */
.hero{padding:6px 0 16px}
.hero .hand{margin-top:6px}
.bigscale .scale button{height:50px;font-size:1.1rem}
.level{font-family:var(--serif);font-size:3rem;font-weight:700;line-height:1}
.tile{display:block;text-align:left;cursor:pointer;width:100%}
.tile:hover{border-color:var(--blue)}
.tile h3{margin:8px 0 4px}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--ink)}
.tag.rose{background:var(--rose-bg);color:var(--rose)}.tag.sage{background:var(--sage-bg);color:var(--sage)}.tag.amber{background:var(--amber-bg);color:var(--amber)}

.quote{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--ink-2)}
.flow{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 18px;font-family:var(--serif);font-style:italic;color:var(--blue);margin:26px 0 6px}

/* Breathing */
.breath-wrap{display:grid;place-items:center;padding:20px 0}
.breath{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--blue) 35%,var(--card)),var(--blue-soft));display:grid;place-items:center;transform:scale(.62);transition:transform 4s ease-in-out;border:2px solid color-mix(in srgb,var(--blue) 40%,transparent)}
.breath.in,.breath.hold-in{transform:scale(1)}
.breath span{font-family:var(--serif);font-size:1.3rem;font-weight:700;transform:scale(1)}
@media (prefers-reduced-motion:reduce){.breath{transition:none}}

/* Doctor */
.dr{display:grid;gap:16px}
@media (min-width:900px){.dr{grid-template-columns:320px 1fr;align-items:start}}
.plist{padding:10px;position:sticky;top:84px}
.pitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:12px;padding:10px;cursor:pointer}
.pitem:hover{background:var(--sky)}
.pitem[aria-current="true"]{background:var(--sky);border-color:var(--line)}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--blue-soft);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rose);flex:none}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-size:1.8rem;line-height:1.1}
.chart{width:100%;height:auto;display:block}
.entry{border-left:3px solid var(--line);padding:4px 0 4px 14px;margin:0 0 14px}
.entry.checkin{border-color:var(--blue)}.entry.thought{border-color:var(--lav)}.entry.energy{border-color:var(--sage)}.entry.gad7{border-color:var(--amber)}.entry.grounding,.entry.breathing{border-color:var(--rose)}.entry.appointment{border-color:var(--lav)}
.qa dt{font-weight:700;font-size:.9rem;color:var(--muted);margin-top:8px}
.qa dd{margin:2px 0 0;white-space:pre-wrap}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;margin:6px 0;background:var(--sky)}
.msg.mine{margin-left:auto;background:var(--ink);color:var(--paper)}
.msg .meta{font-size:.76rem;opacity:.75;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bar-row{display:grid;grid-template-columns:130px 1fr 28px;gap:10px;align-items:center;font-size:.92rem;margin:5px 0}
.bar{height:10px;border-radius:6px;background:var(--sky);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.tablewrap{overflow-x:auto}
table.gad{width:100%;border-collapse:collapse;font-size:.95rem}
table.gad th,table.gad td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center}
table.gad th:first-child,table.gad td:first-child{text-align:left}
table.gad input{width:20px;height:20px;accent-color:var(--ink)}
.gad-mobile .gq{padding:12px 0;border-bottom:1px solid var(--line)}
.banner{background:var(--amber-bg);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:14px;padding:10px 14px;font-size:.93rem}

/* Modal */
dialog{border:0;border-radius:20px;padding:0;max-width:520px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(14,24,41,.45)}
.dlg{padding:24px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
.leaf{position:absolute;right:14px;bottom:10px;opacity:.55;pointer-events:none}
.rel{position:relative}
.loading{min-height:60vh;display:grid;place-items:center;text-align:center}
@media (max-width:520px){ .brand img{height:42px} .brand-name{font-size:1rem} .help-btn{padding:6px 10px;font-size:.82rem} .seg button{padding:7px 9px;font-size:.85rem} .help-long{display:none} .help-short{display:inline} .topbar-in{gap:8px;padding:8px 12px} .scale{gap:3px} .scale button{border-radius:8px;font-size:.9rem;height:38px} .brand-sub{display:none} .hide-sm{display:none} }
</style>
</head>

"use strict";
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);

const now = () => Date.now();
const DAY = 864e5;
const fmtDate = t => new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const fmtDT = t => new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const ago = t => { if(!t) return "never"; const d=(now()-t)/DAY; if(d<1/24) return "just now"; if(d<1) return Math.round(d*24)+"h ago"; if(d<2) return "yesterday"; return Math.round(d)+" days ago"; };

const sameDay = (a,b) => new Date(a).toDateString()===new Date(b).toDateString();
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2400); }
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }

/* ---------------- stores ---------------- */
function DemoStore(){
  const KEY="hml-demo-v1";
  let S=lsGet(KEY,null);
  if(!S){ S=seedDemo(); }
  const L=new Set();
  const emit=()=>{ lsSet(KEY,S); L.forEach(f=>f()); };
  const sub=(fn)=>{ L.add(fn); fn(); return ()=>L.delete(fn); };
  const P=uid=> (S.patients[uid] ||= {summary:{},entries:[],messages:[]});
  const id=()=>Math.random().toString(36).slice(2,11);
  return {
    mode:"demo", me:"demo-me",
    subscribeConfig:cb=>sub(()=>cb({...DEFAULT_CONFIG,...S.config})),
    setConfig:async c=>{S.config={...S.config,...c};emit();},
    subscribePatients:cb=>sub(()=>cb(Object.entries(S.patients).filter(([k,v])=>v.summary.name).map(([k,v])=>({id:k,...v.summary})))),
    getPatient:async uid=>S.patients[uid]?.summary||null,
    upsertPatient:async(uid,d)=>{const p=P(uid);p.summary={...p.summary,...d};emit();},
    subscribeEntries:(uid,cb)=>sub(()=>cb([...(S.patients[uid]?.entries||[])].sort((a,b)=>b.createdAt-a.createdAt))),
    addEntry:async(uid,e)=>{P(uid).entries.push({id:id(),...e});emit();},
    subscribeMessages:(uid,cb)=>sub(()=>cb([...(S.patients[uid]?.messages||[])].sort((a,b)=>a.createdAt-b.createdAt))),
    addMessage:async(uid,m)=>{P(uid).messages.push({id:id(),...m});emit();},
    updateMessage:async(uid,mid,patch)=>{const m=P(uid).messages.find(x=>x.id===mid);if(m)Object.assign(m,patch);emit();},
    deletePatient:async pid=>{delete S.patients[pid];emit();},
    reset:()=>{S=seedDemo();emit();}
  };
}
function seedDemo(){
  const mk=(name,base,drift)=>{
    const entries=[],recent=[];let last=null;
    for(let d=20;d>=0;d--){
      if(Math.random()<.2) continue;
      const t=now()-d*DAY-Math.random()*6*36e5;
      const a=Math.max(0,Math.min(10,Math.round(base+drift*(20-d)/20+(Math.random()*3-1.5))));
      const sy=SYMPTOMS.filter(()=>Math.random()<.22).slice(0,4), tr=TRIGGERS.slice(0,8).filter(()=>Math.random()<.2).slice(0,3);
      entries.push({id:"s"+d+name,type:"checkin",createdAt:t,data:{anxiety:a,energy:Math.max(0,10-a+Math.round(Math.random()*2)),sleep:["Poor","Okay","Good"][Math.floor(Math.random()*3)],symptoms:sy,triggers:tr,helped:HELPERS.filter(()=>Math.random()<.2).slice(0,2),note:""}});
      recent.push(a); last=t;
    }
    [14,7,0].forEach((d,i)=>{const items=GAD7.map(()=>Math.max(0,Math.min(3,Math.round(base/3.2+(drift/10)*i+(Math.random()-.5)))));entries.push({id:"g"+d+name,type:"gad7",createdAt:now()-d*DAY-2*36e5,data:{items,score:items.reduce((a,b)=>a+b,0),difficulty:"Somewhat difficult"}});});
    entries.push({id:"t"+name,type:"thought",createdAt:now()-3*DAY,data:{happened:"Presentation at work was moved to tomorrow morning.",felt:"Panicky, chest tight, couldn't focus.",thought:"Everyone will see I don't know what I'm doing.",need:"To prepare one slide at a time and get some sleep.",response:"I've prepared well before. Being nervous doesn't mean I'll fail.",before:8,after:5}});
    const g=entries.filter(e=>e.type==="gad7").sort((a,b)=>b.createdAt-a.createdAt)[0];
    const la=recent[recent.length-1];
    return {summary:{name,joinedAt:now()-30*DAY,lastCheckIn:last,lastAnxiety:la,lastGad7:g.data.score,recent:recent.slice(-14),lastActivity:last,flagged:la>=8,flagReason:la>=8?"High anxiety check-in ("+la+"/10)":""},entries,messages:[{id:"m1"+name,from:"doctor",text:"Hi "+name.split(" ")[0]+", please try the Thought Record this week when you notice worry building.",task:"thought",createdAt:now()-6*DAY,read:true}]};
  };
  return {config:{},patients:{"demo-a":mk("Nadia Perera (sample)",7,1.5),"demo-b":mk("Ravi Fernando (sample)",6,-3),"demo-me":{summary:{},entries:[],messages:[]}}};
}

function LiveStore(sb,me){
  const err=e=>{ if(e) throw e; };
  const subs=(tables,filterCol,filterVal,load,cb)=>{
    let dead=false, busy=false, again=false;
    const run=async()=>{ if(dead) return; if(busy){ again=true; return; } busy=true; try{ cb(await load()); }catch(e){ console.warn(e); } busy=false; if(again){ again=false; run(); } };
    const ch=sb.channel("rt-"+Math.random().toString(36).slice(2));
    tables.forEach(t=>ch.on("postgres_changes",{event:"*",schema:"public",table:t,...(filterCol?{filter:filterCol+"=eq."+filterVal}:{})},run));
    ch.subscribe();
    const poll=setInterval(run,30000);
    run();
    return ()=>{ dead=true; clearInterval(poll); sb.removeChannel(ch); };
  };
  return {
    mode:"live", me,
    subscribeConfig:cb=>subs(["config"],null,null,async()=>{ const {data,error}=await sb.from("config").select("data").eq("id",1).maybeSingle(); err(error); return {...DEFAULT_CONFIG,...(data?.data||{})}; },cb),
    setConfig:async c=>{ const {data,error}=await sb.from("config").select("data").eq("id",1).maybeSingle(); err(error); const r=await sb.from("config").upsert({id:1,data:{...(data?.data||{}),...c}}); err(r.error); },
    subscribePatients:cb=>subs(["patients","invites"],null,null,async()=>{
      const [p,i]=await Promise.all([sb.from("patients").select("id,data"),sb.from("invites").select("email,name,created_at")]);
      err(p.error); err(i.error);
      return [...p.data.map(r=>({id:r.id,...r.data})),...i.data.map(r=>({id:"inv-"+r.email,name:r.name||r.email,email:r.email,invited:true,joinedAt:new Date(r.created_at).getTime()}))];
    },cb),
    getPatient:async uid=>{ if(String(uid).startsWith("inv-")) return null; const {data,error}=await sb.from("patients").select("data").eq("id",uid).maybeSingle(); err(error); return data?data.data:null; },
    upsertPatient:async(uid,d)=>{
      if(String(uid).startsWith("inv-")){ const email=String(uid).slice(4); const r=await sb.from("invites").upsert({email,name:d.name&&d.name!==email?d.name:null}); err(r.error); return; }
      const r=await sb.rpc("upsert_patient",{pid:uid,patch:d}); err(r.error);
    },
    subscribeEntries:(uid,cb)=>subs(["entries"],"patient_id",uid,async()=>{ const {data,error}=await sb.from("entries").select("id,type,created_at,data").eq("patient_id",uid).order("created_at",{ascending:false}).limit(300); err(error); return data.map(r=>({id:r.id,type:r.type,createdAt:Number(r.created_at),data:r.data})); },cb),
    addEntry:async(uid,e)=>{ const r=await sb.from("entries").insert({patient_id:uid,type:e.type,created_at:e.createdAt,data:e.data}); err(r.error); },
    subscribeMessages:(uid,cb)=>subs(["messages"],"patient_id",uid,async()=>{ const {data,error}=await sb.from("messages").select("id,created_at,data").eq("patient_id",uid).order("created_at",{ascending:true}).limit(300); err(error); return data.map(r=>({id:r.id,createdAt:Number(r.created_at),...r.data})); },cb),
    addMessage:async(uid,m)=>{ const {createdAt,...rest}=m; const r=await sb.from("messages").insert({patient_id:uid,created_at:createdAt,data:rest}); err(r.error); },
    updateMessage:async(uid,mid,patch)=>{ const r=await sb.rpc("update_message",{mid,patch}); err(r.error); },
    deletePatient:async pid=>{ const r=await sb.rpc("delete_patient",{pid}); err(r.error); }
  };
}

const st={store:null,role:"client",isOwner:false,config:{...DEFAULT_CONFIG},me:null,profile:null,entries:[],messages:[],patients:[],view:"home",sel:null,selEntries:[],selMessages:[],drTab:"overview",drMain:"patients",form:{},unsub:[],selUnsub:[]};

let SB=null;
function cfgReady(){ const c=window.HML_CONFIG||{}; return !!(c.supabaseUrl&&c.supabaseAnonKey&&window.supabase); }
async function boot(){
  const hash=location.hash||"";
  if(/type=invite/.test(hash)){ st.authMode="recover"; st.authInvite=true; }
  else if(/error_description=/.test(hash)){ st.authMsg=decodeURIComponent((hash.match(/error_description=([^&]*)/)||[])[1]||"").replace(/\+/g," ")||"That link is invalid or has expired."; if(/expired|invalid/i.test(st.authMsg)) st.authMsg="That link has expired. Ask your clinic to send a new invite, or use “Forgot password?”."; }
  if(!cfgReady()){ st.store=DemoStore(); st.role=lsGet("hml-role","client"); return start(); }
  const c=window.HML_CONFIG;
  SB=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SB.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){ st.authMode="recover"; return showAuth(); }
    if(ev==="SIGNED_OUT"){ teardown(); showAuth(); }
    else if(ev==="SIGNED_IN"&&session&&st.store?.mode!=="live"&&st.authMode!=="recover") setTimeout(()=>enter(session),0);
  });
  const {data:{session}}=await SB.auth.getSession();
  if(st.authMode==="recover"){ if(session) showAuth(); else { st.authMode="signin"; st.authInvite=false; st.authMsg="That invite link has expired. Ask your clinic to send a new one."; showAuth(); } return; }
  if(session) enter(session); else showAuth();
}
async function enter(session){
  if(st.entering) return;
  if(session.user.invited_at&&!session.user.user_metadata?.pw_set){ st.authMode="recover"; st.authInvite=true; return showAuth(); }
  st.entering=true;
  try{
    const {data:prof,error}=await SB.from("profiles").select("role,email").eq("id",session.user.id).maybeSingle();
    if(error||!prof){ await SB.auth.signOut(); st.entering=false; st.authMsg="We couldn't find your account. Please ask your clinic to invite you."; return showAuth(); }
    st.isOwner=prof.role==="doctor"; st.role=st.isOwner?"doctor":"client"; st.userEmail=prof.email;
    st.store=LiveStore(SB,session.user.id);
    await start();
  }catch(e){ console.error(e); st.authMsg="Couldn't load your account. Check your connection and try again."; st.store=null; showAuth(); }
  st.entering=false;
}
async function start(){
  st.store.subscribeConfig(c=>{st.config=c;render();});
  attachClient();
  if(st.role==="doctor") attachDoctor();
  render();
}
function teardown(){ st.unsub.forEach(f=>f&&f()); st.unsub=[]; st.selUnsub.forEach(f=>f&&f()); st.selUnsub=[]; drAttached=false; Object.assign(st,{store:null,profile:null,entries:[],messages:[],patients:[],sel:null,selEntries:[],selMessages:[],view:"home",form:{},isOwner:false,role:"client",authMode:"signin"}); $("#roleSlot").innerHTML=""; $("#bannerSlot").innerHTML=""; $("#tabbar").hidden=true; }
function showAuth(){
  $("#roleSlot").innerHTML=""; $("#bannerSlot").innerHTML=""; $("#tabbar").hidden=true;
  const m=st.authMode||"signin", msg=st.authMsg||"", ok=st.authOk||"";
  const f=st.authForm||{};
  const title={signin:"Welcome back",signup:"Create your account",forgot:"Reset your password",recover:st.authInvite?"Welcome! Choose a password":"Choose a new password"}[m];
  const sub={signin:"Sign in to your calm space.",signup:"Use the email address your clinic invited, then choose a password.",forgot:"We'll email you a link to set a new password.",recover:st.authInvite?"Set a password to finish creating your account.":"Enter a new password for your account."}[m];
  $("#app").innerHTML=`<div class="card" style="max-width:440px;margin:32px auto"><h1 style="margin-bottom:6px">${title}</h1><p class="hand" style="margin-bottom:14px">${sub}</p>
  <form id="authForm" class="stack" novalidate>
   ${m!=="recover"?`<label><b>Email</b><input type="email" id="auEmail" autocomplete="email" value="${esc(f.email||"")}"></label>`:""}
   ${m!=="forgot"?`<label><b>${m==="recover"?"New password":"Password"}</b><input type="password" id="auPw" autocomplete="${m==="signin"?"current-password":"new-password"}" placeholder="${m==="signin"?"":"At least 8 characters"}"></label>`:""}
   ${m==="signup"?`<label><b>Confirm password</b><input type="password" id="auPw2" autocomplete="new-password"></label>`:""}
   ${msg?`<p class="tag rose" role="alert" style="white-space:normal">${esc(msg)}</p>`:""}${ok?`<p class="tag sage" role="status" style="white-space:normal">${esc(ok)}</p>`:""}
   <button class="btn" type="submit" id="auGo">${{signin:"Sign in",signup:"Create account",forgot:"Send reset link",recover:"Save new password"}[m]}</button>
  </form>
  <p class="small" style="margin-top:14px;display:flex;gap:14px;flex-wrap:wrap">${m==="signin"?`<a href="#" data-auth="signup">First time? Create account</a><a href="#" data-auth="forgot">Forgot password?</a>`:m==="recover"?"":`<a href="#" data-auth="signin">Back to sign in</a>`}</p>
  <p class="small muted" style="margin-top:10px">If you need help right now, tap “Need help now?” at the top.</p></div>`;
}
document.addEventListener("click",ev=>{ const a=ev.target.closest("[data-auth]"); if(!a) return; ev.preventDefault(); st.authMode=a.dataset.auth; st.authMsg=""; st.authOk=""; st.authForm={email:($("#auEmail")||{}).value||""}; showAuth(); });
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="authForm") return; ev.preventDefault();
  const m=st.authMode||"signin", email=(($("#auEmail")||{}).value||"").trim().toLowerCase(), pw=($("#auPw")||{}).value||"", pw2=($("#auPw2")||{}).value||"";
  const fail=t=>{ st.authMsg=t; st.authOk=""; st.authForm={email}; showAuth(); };
  if(m!=="recover"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("Enter a valid email address.");
  if(m!=="forgot"&&pw.length<8) return fail("Password must be at least 8 characters.");
  if(m==="signup"&&pw!==pw2) return fail("Passwords don't match.");
  const btn=$("#auGo"); btn.disabled=true; st.authMsg=""; st.authOk="";
  try{
    if(m==="signin"){
      const {error}=await SB.auth.signInWithPassword({email,password:pw});
      if(error) return fail(/confirm/i.test(error.message)?"Please confirm your email first. Check your inbox for the link.":"Email or password is incorrect.");
    } else if(m==="signup"){
      const {data,error}=await SB.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
      if(error) return fail(/database error|NOT_INVITED|not invited/i.test(error.message)?"This email hasn't been invited yet. Please ask your clinic to invite you.":/registered|exists/i.test(error.message)?"An account with this email already exists. Try signing in.":error.message);
      if(!data.session){ st.authMode="signin"; st.authForm={email}; st.authOk="Account created. Check your email and click the confirmation link, then sign in."; return showAuth(); }
    } else if(m==="forgot"){
      const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(error) return fail("Couldn't send the email. Try again in a few minutes.");
      st.authMode="signin"; st.authForm={email}; st.authOk="If that email has an account, a reset link is on its way."; return showAuth();
    } else if(m==="recover"){
      const {error}=await SB.auth.updateUser({password:pw,data:{pw_set:true}});
      if(error) return fail(error.message);
      st.authMode="signin"; st.authOk=""; st.authInvite=false; history.replaceState(null,"",location.pathname);
      const {data:{session}}=await SB.auth.getSession(); if(session) enter(session); else showAuth();
    }
  }catch(e){ fail("Something went wrong. Check your connection and try again."); }
});
function attachClient(){
  const s=st.store, me=s.me;
  st.unsub.push(s.subscribeEntries(me,e=>{st.entries=e;render();}));
  st.unsub.push(s.subscribeMessages(me,m=>{st.messages=m;render();}));
  s.getPatient(me).then(p=>{st.profile=p;render();}).catch(()=>{});
}
let drAttached=false;
function attachDoctor(){ if(drAttached) return; drAttached=true; st.store.subscribePatients(p=>{st.patients=p;render();}); }
function selectPatient(uid){
  st.selUnsub.forEach(f=>f&&f()); st.selUnsub=[]; st.sel=uid; st.selEntries=[]; st.selMessages=[];
  if(uid){ st.selUnsub.push(st.store.subscribeEntries(uid,e=>{st.selEntries=e;render();})); st.selUnsub.push(st.store.subscribeMessages(uid,m=>{st.selMessages=m;render();})); const seen=lsGet("hml-seen",{}); seen[uid]=now(); lsSet("hml-seen",seen); }
  render(); window.scrollTo({top:0,behavior:"smooth"});
}

function lineChart(series,{min=0,max=10,h=190,days=30}={}){
  const W=640,H=h,pl=30,pr=12,pt=12,pb=26,t1=now(),t0=t1-days*DAY;
  const x=t=>pl+(W-pl-pr)*((t-t0)/(t1-t0)), y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  let g="";
  (max===21?[0,7,14,21]:[min,(min+max)/2,max]).forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${v}</text>`;});
  for(let d=0;d<=days;d+=(days>40?21:7)){const t=t1-d*DAY;g+=`<text x="${x(t)}" y="${H-6}" font-size="11" text-anchor="${d===0?"end":"middle"}" fill="var(--muted)">${fmtDate(t)}</text>`;}
  series.forEach(s=>{const pts=s.points.filter(p=>p.t>=t0).sort((a,b)=>a.t-b.t);if(!pts.length)return;
    g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>x(p.t)+","+y(p.v)).join(" ")}"/>`;
    g+=pts.map(p=>`<circle cx="${x(p.t)}" cy="${y(p.v)}" r="4" fill="${s.dotColor?s.dotColor(p.v):s.color}" stroke="var(--card)" stroke-width="1.5"><title>${fmtDT(p.t)}: ${p.v}</title></circle>`).join("");});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart">${g}</svg>`;
}
function spark(vals){ if(!vals||vals.length<2) return ""; const W=80,H=24; const pts=vals.map((v,i)=>`${(i/(vals.length-1))*W},${H-2-(v/10)*(H-4)}`).join(" "); return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${anxColor(vals[vals.length-1])}" stroke-width="2" stroke-linejoin="round"/></svg>`; }
function freqBars(entries,key,top=6){
  const c={}; entries.forEach(e=>(e.data?.[key]||[]).forEach(v=>c[v]=(c[v]||0)+1));
  const arr=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,top); if(!arr.length) return `<p class="muted small">Nothing recorded yet.</p>`;
  const m=arr[0][1]; return arr.map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar"><i style="width:${v/m*100}%"></i></div><b>${v}</b></div>`).join("");
}
function entryDetail(e){

  if(e.type==="checkin") return `<p><b style="color:${anxColor(d.anxiety)}">Anxiety ${d.anxiety}/10</b> · Energy ${d.energy??"—"}/10 · Sleep ${esc(d.sleep||"—")}</p>

  if(e.type==="thought") return `<dl class="qa">${THOUGHT_QS.map(([k,q])=>d[k]?`<dt>${q}</dt><dd>${esc(d[k])}</dd>`:"").join("")}</dl>${d.before!=null?`<p class="small" style="margin-top:8px">Anxiety before <b>${d.before}</b> → after <b>${d.after??"—"}</b></p>`:""}`;
  if(e.type==="gad7"){const[b,c]=gadBand(d.score);return `<p><span class="tag ${c}">${d.score}/21 · ${b}</span></p><dl class="qa">${GAD7.map((q,i)=>`<dt>${q}</dt><dd>${GAD_OPTS[d.items[i]]}</dd>`).join("")}${d.difficulty?`<dt>How difficult have these made daily life?</dt><dd>${esc(d.difficulty)}</dd>`:""}</dl>`;}
  if(e.type==="energy") return `<p>Energy ${d.energy??"—"}/10</p><dl class="qa">${d.supports?`<dt>Supports my energy</dt><dd>${esc(d.supports)}</dd>`:""}${d.drains?`<dt>Drains my energy</dt><dd>${esc(d.drains)}</dd>`:""}${d.resisting?`<dt>Resisting</dt><dd>${esc(d.resisting)}</dd>`:""}${d.closed?.length?`<dt>Feels true right now</dt><dd>${d.closed.map(esc).join("\n")}</dd>`:""}${d.allow?`<dt>Can allow to move through</dt><dd>${esc(d.allow)}</dd>`:""}${d.actions?.length?`<dt>Actions chosen</dt><dd>${d.actions.map(esc).join("\n")}</dd>`:""}${d.intention?`<dt>Intention</dt><dd>${esc(d.intention)}</dd>`:""}</dl>`;
  if(e.type==="grounding") return `<dl class="qa">${["see","touch","hear","smell","taste"].map(k=>d[k]?`<dt>${k[0].toUpperCase()+k.slice(1)}</dt><dd>${esc(d[k])}</dd>`:"").join("")}</dl>${d.before!=null?`<p class="small">Anxiety before <b>${d.before}</b> → after <b>${d.after??"—"}</b></p>`:""}`;
  if(e.type==="breathing") return `<p class="small">${d.rounds} rounds of box breathing${d.before!=null?` · anxiety ${d.before} → ${d.after??"—"}`:""}</p>`;
  return "";
}

function go(v,taskId){ if(v==="breathing"&&breathTimer===null) breathRounds=0; st.view=v; st.form={}; if(taskId) st.form._task=taskId; render(); window.scrollTo({top:0}); }

/* ---------------- saving ---------------- */
async function saveEntry(type,data,summaryExtra={}){
  const s=st.store, me=s.me, t=now();
  try{
    await s.addEntry(me,{type,createdAt:t,data});
    const cur=(await s.getPatient(me))||{};
    const sum={lastActivity:t,name:st.profile?.name||cur.name||"Client",...summaryExtra};
    if(summaryExtra.flagged===false) delete sum.flagged;
    await s.upsertPatient(me,sum);
    st.profile={...cur,...sum};
    if(st.form._task) await s.updateMessage(me,st.form._task,{done:true}).catch(()=>{});
    else { const open=st.messages.find(m=>m.from==="doctor"&&m.task===type&&!m.done); if(open) await s.updateMessage(me,open.id,{done:true}).catch(()=>{}); }
    return true;
  }catch(e){ console.error(e); toast("Couldn't save. Check your connection and try again."); return false; }
}

/* ---------------- events ---------------- */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button,[data-go]"); if(!b) return;
  const d=b.dataset, f=st.form;
  if(b.id==="helpBtn"||b.id==="helpTile") return openHelp();
  if(b.id==="signOut"){ await SB.auth.signOut(); return; }
  if(b.id==="brandBtn"){ if(st.role==="client") go("home"); else {st.drTab="overview";st.drMain="patients";selectPatient(null);} return; }
  if(d.role){ st.role=d.role; lsSet("hml-role",d.role); if(d.role==="doctor") attachDoctor(); st.view="home"; render(); return; }
  if(d.go!==undefined){ return go(d.go,d.task); }
  if(d.scale){ const v=+d.v; if(d.scale==="quick"){ go("checkin"); st.form.anxiety=v; render(); return; } f[d.scale]=v; render(); return; }
  if(d.chip){ const single=["sleep","difficulty"].includes(d.chip); if(single) f[d.chip]=f[d.chip]===d.v?null:d.v; else { const a=f[d.chip]||[]; f[d.chip]=a.includes(d.v)?a.filter(x=>x!==d.v):[...a,d.v]; } render(); return; }
  if(d.gad!==undefined){ f.items ||= Array(7).fill(null); f.items[+d.gad]=+d.v; render(); return; }
  if(d.pat!==undefined){ st.drTab="overview"; st.form={}; selectPatient(d.pat||null); return; }
  if(d.drtab){ st.drTab=d.drtab; render(); return; }
  if(d.dr==="settings"){ st.drTab="settings"; render(); return; }
  if(d.dr==="back"){ st.drTab="overview"; render(); return; }
  if(d.filter){ f.drFilter=d.filter; render(); return; }
  if(d.drmain){ st.drMain=d.drmain; st.drTab="overview"; render(); return; }
  if(d.apt){ const pid=d.aptid, pat=st.patients.find(x=>x.id===pid); if(!pat) return; const cur=pat.nextAppt||{}; const status=d.apt==="confirm"?"confirmed":d.apt==="decline"?"cancelled":d.apt==="cancel"?"cancelled":d.apt==="complete"?"completed":cur.status; b.disabled=true; try{ await st.store.upsertPatient(pid,{nextAppt:{...cur,status}}); toast("Updated"); render(); }catch(e){ toast("Couldn't update. Try again."); b.disabled=false; } return; }
  if(b.id==="addClientBtn"){ openAddClient(); return; }
  if(b.id==="addClientGo"){
    const email=$("#newClientEmail").value.trim(), name=$("#newClientName").value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast("Enter a valid email address.");
    const id="inv-"+email.toLowerCase();
    b.disabled=true;
    try{
      if(st.store.mode==="live"){
        const {data,error}=await SB.functions.invoke("invite-client",{body:{email:email.toLowerCase(),name,redirectTo:location.origin+location.pathname}});
        let msg=data?.error; if(!msg&&error){ try{ msg=(await error.context.json()).error; }catch(_){ msg=error.message; } }
        if(msg){ toast(/already/i.test(msg)?"That email already has an account.":"Couldn't send invite: "+msg); b.disabled=false; return; }
        toast("Invite emailed to "+email); $("#dlg").close(); return;
      }
      await st.store.upsertPatient(id,{name:name||email,email:email.toLowerCase(),joinedAt:now(),invited:true});
      const link=location.href.split("#")[0];
      const subject="You're invited to "+st.config.clinicName;
      const body="Hi"+(name?" "+name:"")+",\n\n"+st.config.doctorName+" has invited you to "+st.config.clinicName+".\n\nOpen this link, choose \"First time? Create account\", and use this email address ("+email+"):\n"+link+"\n\n"+st.config.welcome;
      window.open("mailto:"+encodeURIComponent(email)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body),"_blank");
      toast("Client added"); $("#dlg").close();
    }catch(e){ toast("Couldn't add client."); b.disabled=false; }
    return;
  }
  if(b.id==="addApptBtn"){ openAddAppt(); return; }
  if(b.id==="addApptGo"){ const pid=$("#apPat").value, date=$("#apDate").value, time=$("#apTime").value.trim(), reason=$("#apReason").value.trim(); if(!pid||!date) return toast("Choose a client and date."); b.disabled=true; try{ await st.store.upsertPatient(pid,{nextAppt:{date,time,reason,status:"confirmed"}}); await st.store.addEntry(pid,{type:"appointment",createdAt:now(),data:{date,time,reason,status:"confirmed",by:"doctor"}}); toast("Appointment scheduled"); $("#dlg").close(); render(); }catch(e){ toast("Couldn't schedule."); b.disabled=false; } return; }
  if(b.id==="genReport"){ openReport(); return; }
  if(b.id==="delClient"){ const p=st.patients.find(x=>x.id===st.sel)||{}; if(st.sel===st.store.me) return toast("You can't delete your own test record here."); $("#dlgBody").innerHTML=`<h2 style="margin-bottom:10px">Delete ${esc(p.name||"this client")}?</h2><p>This permanently deletes their account, check-ins, worksheets and messages. It can't be undone.</p><div class="row" style="margin-top:14px"><button class="btn" id="delClientGo" style="background:var(--rose)">Yes, delete permanently</button><button class="btn ghost" id="closeDlg">Cancel</button></div>`; $("#dlg").showModal(); return; }
  if(b.id==="delClientGo"){ const pid=st.sel; b.disabled=true; try{ await st.store.deletePatient(pid); st.patients=st.patients.filter(x=>x.id!==pid); selectPatient(null); $("#dlg").close(); toast("Client deleted"); }catch(e){ console.error(e); toast("Couldn't delete. Try again."); b.disabled=false; } return; }
  if(b.id==="printReport"){ window.print(); return; }

  if(b.id==="saveName"){ const n=$("#nm").value.trim(); if(!n) return toast("Please enter a name."); b.disabled=true; try{ await st.store.upsertPatient(st.store.me,{name:n,lastActivity:now()}); st.profile={...(st.profile||{}),name:n}; render(); }catch(e){ toast("Couldn't save. Try again."); b.disabled=false; } return; }
  if(b.id==="saveCheckin"){ if(f.anxiety==null) return; b.disabled=true;
    const data={anxiety:f.anxiety,energy:f.energy??null,sleep:f.sleep||null,symptoms:f.symptoms||[],triggers:f.triggers||[],helped:f.helped||[],note:(f.note||"").trim(),contactMe:!!f.contactMe};
    const recent=[...st.entries.filter(e=>e.type==="checkin").slice(0,13).reverse().map(e=>e.data.anxiety),f.anxiety];
    const extra={lastCheckIn:now(),lastAnxiety:f.anxiety,recent};
    if(f.anxiety>=8||f.contactMe){ extra.flagged=true; extra.flagReason=f.contactMe?"Asked to be contacted":"High anxiety check-in ("+f.anxiety+"/10)"; }
    if(await saveEntry("checkin",data,extra)){ toast("Check-in saved"); go("home"); } else b.disabled=false; return; }
  if(b.id==="saveThought"){ const data={before:f.before??null,after:f.after??null}; THOUGHT_QS.forEach(([k])=>data[k]=(f[k]||"").trim()); if(!THOUGHT_QS.some(([k])=>data[k])) return toast("Write at least one answer to save."); b.disabled=true; if(await saveEntry("thought",data)){ toast("Thought record saved"); go("history"); } else b.disabled=false; return; }
  if(b.id==="saveEnergy"){ const acts=[...(f.actions||[])]; if((f.otherAction||"").trim()) acts.push("Other: "+f.otherAction.trim()); const data={energy:f.energy??null,supports:f.supports||"",drains:f.drains||"",resisting:f.resisting||"",closed:f.closed||[],allow:f.allow||"",actions:acts,intention:f.intention||""}; b.disabled=true; if(await saveEntry("energy",data)){ toast("Worksheet saved"); go("history"); } else b.disabled=false; return; }
  if(b.id==="saveGad"){ const score=f.items.reduce((a,c)=>a+c,0); const extra={lastGad7:score}; if(score>=15){extra.flagged=true;extra.flagReason="Severe GAD-7 ("+score+"/21)";} b.disabled=true; if(await saveEntry("gad7",{items:f.items,score,difficulty:f.difficulty||null},extra)){ toast("Saved. Score "+score+"/21"); go("home"); } else b.disabled=false; return; }
  if(b.id==="saveGround"){ const data={before:f.before??null,after:f.after??null}; ["see","touch","hear","smell","taste"].forEach(k=>data[k]=(f[k]||"").trim()); b.disabled=true; if(await saveEntry("grounding",data)){ toast("Saved"); go("calm"); } else b.disabled=false; return; }
  if(b.id==="breathGo"){ breathTimer?stopBreath():startBreath(); return; }
  if(b.id==="saveBreath"){ b.disabled=true; if(await saveEntry("breathing",{rounds:breathRounds,before:f.before??null,after:f.after??null})){ toast("Saved"); breathRounds=0; go("calm"); } else b.disabled=false; return; }
  if(b.id==="reqAppt"){ const date=(f.apptDate||"").trim(), time=(f.apptTime||"").trim(); if(!date) return toast("Choose a date."); b.disabled=true; const data={date,time,reason:(f.apptReason||"").trim(),status:"requested"}; try{ await st.store.addEntry(st.store.me,{type:"appointment",createdAt:now(),data}); await st.store.upsertPatient(st.store.me,{nextAppt:data,lastActivity:now(),name:st.profile?.name||"Client"}); st.profile={...(st.profile||{}),nextAppt:data}; f.apptDate="";f.apptTime="";f.apptReason=""; toast("Appointment requested"); render(); }catch(e){ toast("Couldn't send. Try again."); b.disabled=false; } return; }
  if(b.id==="cancelAppt"){ b.disabled=true; try{ const upd={...(st.profile?.nextAppt||{}),status:"cancelled"}; await st.store.upsertPatient(st.store.me,{nextAppt:upd}); st.profile={...(st.profile||{}),nextAppt:upd}; toast("Cancelled"); render(); }catch(e){ toast("Couldn't update. Try again."); b.disabled=false; } return; }
  if(b.id==="sendMsg"){ const t=$("#msgText").value.trim(); if(!t) return; b.disabled=true; try{ await st.store.addMessage(st.store.me,{from:"client",text:t,createdAt:now(),read:false}); await st.store.upsertPatient(st.store.me,{lastActivity:now(),name:st.profile?.name||"Client"}); toast("Message sent"); }catch(e){ toast("Couldn't send. Try again."); b.disabled=false; } return; }
  if(b.id==="drSend"){ const t=$("#drMsg").value.trim(), task=$("#drTask").value; if(!t&&!task) return; b.disabled=true; try{ await st.store.addMessage(st.sel,{from:"doctor",text:t||("Please complete: "+TASKS[task]),task:task||null,done:false,createdAt:now(),read:false}); toast("Sent"); render(); }catch(e){ toast("Couldn't send. Try again."); b.disabled=false; } return; }
  if(b.id==="clearFlag"){ try{ await st.store.upsertPatient(st.sel,{flagged:false,flagReason:""}); toast("Marked as reviewed"); }catch(e){ toast("Couldn't update. Try again."); } return; }
  if(b.id==="saveCfg"){ try{ await st.store.setConfig({clinicName:$("#cfName").value.trim()||DEFAULT_CONFIG.clinicName,doctorName:$("#cfDoc").value.trim()||DEFAULT_CONFIG.doctorName,welcome:$("#cfWel").value.trim(),crisisText:$("#cfCrisis").value.trim()||DEFAULT_CONFIG.crisisText}); toast("Settings saved"); }catch(e){ toast("Couldn't save settings."); } return; }
  if(b.id==="resetDemo"){ st.store.reset(); st.profile=null; selectPatient(null); toast("Demo data reset"); return; }
  if(b.id==="closeDlg"){ $("#dlg").close(); return; }
});
document.addEventListener("input",ev=>{
  const el=ev.target; if(el.dataset.field){ st.form[el.dataset.field]=el.type==="checkbox"?el.checked:el.value; if(el.dataset.field==="contactMe") render(); }
  if(el.dataset.list){ const k=el.dataset.list, a=st.form[k]||[]; st.form[k]=el.checked?[...a,el.value]:a.filter(x=>x!==el.value); }
});
function openHelp(){
  $("#dlgBody").innerHTML=`<h2 style="margin-bottom:10px">You're not alone</h2><p style="white-space:pre-wrap">${esc(st.config.crisisText)}</p><div class="row" style="margin-top:14px"><button class="btn" id="closeDlg">Close</button>${st.role==="client"?`<button class="btn ghost" data-go="breathing" onclick="document.getElementById('dlg').close()">Try box breathing</button>`:""}</div>`;
  $("#dlg").showModal();
}
/* breathing loop */
const PHASES=[["Breathe in","in"],["Hold","hold-in"],["Breathe out","out"],["Hold","hold-out"]];
function startBreath(){ let i=0,c=4; const step=()=>{ const C=$("#breathC"),T=$("#breathT"); if(!C){stopBreath();return;} const [lab,cls]=PHASES[i]; C.className="breath "+cls; T.textContent=lab+" "+c; c--; if(c<1){ c=4; i=(i+1)%4; if(i===0){ breathRounds++; const r=$("#breathR"); if(r) r.textContent=breathRounds+(breathRounds===1?" round":" rounds"); } } };
  breathTimer=setInterval(step,1000); step(); const g=$("#breathGo"); if(g) g.textContent="Stop"; const pre=$("#breathPre"); if(pre) pre.hidden=true; }
function stopBreath(){ clearInterval(breathTimer); breathTimer=null; const C=$("#breathC"),T=$("#breathT"); if(C){C.className="breath";T.textContent="Well done";} const g=$("#breathGo"); if(g) g.textContent="Start"; if(breathRounds){ const p=$("#breathPost"); if(p) p.hidden=false; } }

boot();
</script>
</body>
</html>
